name: Build VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon
          make -C math-neon install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK
          make -C vitaShaRK install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          make -C vitaGL -j4 install

      - name: Build VPK
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: RoofRunner-vpk
          path: build/RoofRunner.vpk
