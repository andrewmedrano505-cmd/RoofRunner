name: Build VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon
          make -C math-neon install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK
          sed -i 's|^//#define DISABLE_SHACCCG_EXTENSIONS|#define DISABLE_SHACCCG_EXTENSIONS|' vitaShaRK/source/vitashark.c
          make -C vitaShaRK install
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          make -C vitaGL HAVE_VITA3K_SUPPORT=1 -j4 install

      - name: Build VPK
        run: |
          PROJ=$(dirname "$(find "$GITHUB_WORKSPACE" -name CMakeLists.txt | head -1)")
          mkdir -p /tmp/build
          cd /tmp/build
          cmake "$PROJ"
          make

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: RoofRunner-vpk
          path: /tmp/build/RoofRunner.vpk
